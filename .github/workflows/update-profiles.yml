name: Update Browser Fingerprints

on:
  schedule:
    # Запуск каждый понедельник в 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Возможность ручного запуска из UI GitHub

permissions:
  contents: write

jobs:
  capture-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'latest'
          cache: true

      - name: Install Dependencies
        run: go mod tidy

      - name: Capture Latest Chrome Fingerprint
        run: |
          go run ./cmd/capture -out=profiles/chrome_latest.json

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profiles/
          
          if git diff --staged --quiet; then
            echo "No changes in browser fingerprint. Everything is up to date."
          else
            VERSION=$(cat profiles/chrome_latest.json | grep -o '"user-agent": "[^"]*' | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1)
            git commit -m "chore(profiles): update Chrome fingerprint to v${VERSION} [skip ci]"
            git push
            echo "New fingerprint committed and pushed!"
          fi